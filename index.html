<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flores Amarillas 🌼</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#020b0d;font-family:Georgia,serif}
.sky{position:fixed;inset:0;overflow:hidden;background:
radial-gradient(circle at 50% 55%,rgba(20,80,62,.24),transparent 40%),
linear-gradient(#01080a,#031416 62%,#020b0b)}
.stars{position:absolute;inset:-10%;background-image:
radial-gradient(circle,rgba(255,255,255,.9) 0 1.15px,transparent 1.8px),
radial-gradient(circle,rgba(255,235,160,.72) 0 1px,transparent 1.7px);
background-size:88px 105px,157px 171px;background-position:5px 9px,38px 61px;
animation:stars 35s linear infinite}
@keyframes stars{to{background-position:85px 65px,118px 121px}}

.shooting{position:absolute;width:130px;height:2px;border-radius:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),#fff);
box-shadow:0 0 7px #fff;transform:rotate(32deg);opacity:0;
animation:shoot 6.5s linear infinite}
.shooting:after{content:"";position:absolute;right:0;top:50%;width:6px;height:6px;
border-radius:50%;transform:translateY(-50%);background:#fff;box-shadow:0 0 9px 3px #fff}
.s1{top:14%;left:4%;animation-delay:.8s}.s2{top:28%;left:64%;animation-delay:3.2s}
.s3{top:44%;left:-5%;animation-delay:5.4s}.s4{top:8%;left:49%;animation-delay:7s}
@keyframes shoot{0%,63%{opacity:0;transform:translate(0,0) rotate(32deg)}
67%{opacity:1}80%{opacity:1;transform:translate(235px,145px) rotate(32deg)}
82%,100%{opacity:0;transform:translate(290px,180px) rotate(32deg)}}

.glow{position:absolute;width:520px;height:520px;left:50%;top:53%;
transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,213,57,.08),transparent 68%);
animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07);opacity:.7}}

.title{position:absolute;z-index:30;top:5%;left:0;right:0;text-align:center;
color:#fff4a0;font-size:clamp(23px,5vw,38px);letter-spacing:1px;
text-shadow:0 0 12px rgba(255,214,50,.5)}
.subtitle{position:absolute;z-index:30;top:12%;left:0;right:0;text-align:center;
color:rgba(255,255,255,.72);font-size:clamp(11px,2.5vw,15px);letter-spacing:3px}

.bouquet{position:absolute;left:50%;bottom:-2%;width:min(500px,100vw);height:min(720px,91vh);
transform:translateX(-50%);animation:breeze 5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breeze{0%,100%{transform:translateX(-50%) rotate(-.55deg)}
50%{transform:translateX(-50%) rotate(.55deg)}}
svg{width:100%;height:100%;overflow:visible}

.stem{fill:none;stroke:url(#stem);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
transform-box:fill-box;transform-origin:50% 100%;animation:stem 4.2s ease-in-out infinite}
.stem:nth-of-type(2n){animation-duration:4.7s}
@keyframes stem{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}


/* Floración inicial: las flores brotan y luego pasan al movimiento de brisa */
.flowerGroup{
  transform-box:fill-box;
  transform-origin:50% 100%;
  animation:
    bloom 2s cubic-bezier(.22,.75,.25,1) both,
    flower 4s ease-in-out 2s infinite;
}
.flowerGroup:nth-of-type(2n){
  animation-duration:2.25s,4.6s;
}
.flowerGroup:nth-of-type(3n){
  animation-duration:2.5s,3.7s;
}
@keyframes bloom{
  0%{
    opacity:0;
    transform:translateY(20px) scale(.62) rotate(-4deg);
    filter:blur(1.5px) drop-shadow(0 0 0 rgba(255,214,44,0));
  }
  45%{
    opacity:.72;
    transform:translateY(3px) scale(.94) rotate(1.5deg);
    filter:blur(.35px) drop-shadow(0 0 10px rgba(255,214,44,.42));
  }
  72%{
    opacity:1;
    transform:translateY(-1px) scale(1.015) rotate(-.5deg);
    filter:drop-shadow(0 0 13px rgba(255,214,44,.62));
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0deg);
    filter:drop-shadow(0 0 9px rgba(255,214,44,.5));
  }
}

@keyframes flower{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(3.2deg) translateY(-2px)}}
50%{transform:rotate(3.2deg) translateY(-2px)}}

.petal{stroke:rgba(190,130,10,.22);stroke-width:1;filter:drop-shadow(0 0 8px rgba(255,214,44,.72));transform-box:fill-box;transform-origin:50% 100%;animation:petalBloom 1.15s cubic-bezier(.2,.8,.25,1) both}
@keyframes petalBloom{0%{opacity:.35;transform:scaleY(.55) scaleX(.82)}60%{opacity:.9;transform:scaleY(1.025) scaleX(1.01)}100%{opacity:1;transform:scaleY(1) scaleX(1)}}
.leaf{fill:url(#leaf);transform-box:fill-box;transform-origin:0 50%;animation:leaf 4.4s ease-in-out infinite}
@keyframes leaf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}

.ribbon{position:absolute;z-index:11;left:50%;bottom:18%;width:105px;height:35px;
transform:translateX(-50%);background:#c99174;border-radius:50%}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:-11px;width:61px;height:72px;background:#dda88b;
clip-path:polygon(50% 0,100% 20%,78% 70%,50% 100%,42% 50%,0 22%)}
.ribbon:before{right:64%;transform:rotate(15deg)}.ribbon:after{left:64%;transform:scaleX(-1) rotate(15deg)}

@media(max-height:680px){.bouquet{height:94vh}.title{top:2%}.subtitle{top:8%}}
</style>
</head>
